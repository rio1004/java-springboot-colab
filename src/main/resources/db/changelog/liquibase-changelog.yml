databaseChangeLog:
  - changeSet:
      id: 1
      author: Tavie
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: product
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(45)
              - column:
                  name: description
                  type: VARCHAR(45)
              - column:
                  name: type
                  type: INT
              - column:
                  name: quantity
                  type: INT
              - column:
                  name: unit_price
                  type: DECIMAL

  - changeSet:
      id: 2
      author: Tavie
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: firstname
                  type: VARCHAR(255)
              - column:
                  name: lastname
                  type: VARCHAR(255)
              - column:
                  name: address
                  type: VARCHAR(255)
