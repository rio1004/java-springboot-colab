server:
  port: 1023

spring:
  application:
    name: "demo"

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/sql12740074}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:defaultpassword}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  hikari:
    validation-timeout: 5000 # 5 seconds
    connection-timeout: 30000 # 30 seconds
    maximum-pool-size: 5 # Maximum 5 connections to mysql Data base
    connection-test-query: "SELECT 1" # Validation query

  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:/db/changelog/db.changelog-master.yml
    # default-schema: public
    # rollbackFile: classpath:/db/changelog/rollback.sql  

logging:
  pattern:
    # Colorful and structured logging pattern
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    # Add file name and line number for better error tracing
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  # Optional: Log to file for persistent error tracking
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 7

  level:
    # Framework logs - Keep quiet unless there's an issue
    org:
      springframework:
        web: WARN          # Web layer logs
        security: WARN     # Security logs
        boot: WARN        # Boot specific logs
      hibernate:
        SQL: ERROR        # Show only SQL errors
        type: ERROR       # Hide SQL parameter binding
      apache: ERROR       # Apache commons
    
      # Other tools
    springfox: ERROR
    org.mongodb: ERROR
    
    # Your application logs - Keep verbose for debugging
    com:
      yourcompany:
        controllers: INFO    # API endpoints
        services: INFO       # Business logic
        security: INFO       # Security related
        repository: INFO     # Database operations
        zaxxer:
        hikari: ERROR     # Connection pool