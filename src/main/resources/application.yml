server:
  port: 1023

spring:
  application:
    name: "demo"

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/sql12740074}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:defaultpassword}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  hikari:
    validation-timeout: 5000 # 5 seconds
    connection-timeout: 30000 # 30 seconds
    maximum-pool-size: 5 # Maximum 5 connections to mysql Data base
    connection-test-query: "SELECT 1" # Validation query

  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:/db/changelog/db.changelog-master.yml
    # default-schema: public
    # rollbackFile: classpath:/db/changelog/rollback.sql  

  jpa:
    open-in-view: false
  main:
    banner-mode: console
  output:
    ansi:
      enabled: always  # Enable ANSI colors

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n"
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.example.demo: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs